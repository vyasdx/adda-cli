# Developed by - Vedavyas Vayalpadu - vyas4c3@gmail.com
# Coded by - Claude Code
#
# ENH-ADDA-011. `adda diff` and `adda audit` were built with exit-1 contracts
# specifically so a machine could tell pass from fail (ENH-ADDA-007), and until
# now nothing consumed them. The pre-commit hook is per-machine, untracked, and
# fails open, so enforcement lapsed on every fresh clone.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the declared floor (raised from 3.9 by BUG-ADDA-005, where
        # `str | None` without deferred annotations raised at import). Testing
        # the floor itself is what makes that declaration honest.
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v7
        with:
          # REQUIRED, not a preference. `adda audit` decides staleness by git
          # commit ancestry, and on a shallow clone `merge-base --is-ancestor`
          # can exit 1 because it ran out of history rather than because the
          # answer is no. Full history is what makes the staleness rule
          # decidable here. See docs/modules/audit.md.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: |
          pip install ruff==0.14.5
          ruff check .

      - name: Tests
        run: python -m pytest -q

      # ENH-ADDA-020. The README's test badge is a published claim about this
      # repo, kept by hand, and it drifted five times — twice while fixing an
      # unrelated bug. It is not auto-corrected: rewriting a stale number hides
      # the drift, and noticing is the point (same reason `audit` reports a
      # stale doc rather than touching it).
      - name: Published counts — badge and open items must match reality
        if: matrix.python-version == '3.13'
        run: python scripts/check_counts.py

      - name: Drift — documented modules vs the actual repo
        run: adda diff .

      - name: Doc drift — missing, stale, unmapped or orphaned module docs
        run: adda audit .

      # `adda eval` prints its numbers and exits 0 by design, so CI has to make
      # the assertion itself. Overall fidelity is expected below 100% (dropping
      # prose is the intended compression trade-off); load-bearing MUST be 100%
      # — anything less means rehydrate lost a constraint, an active module, or
      # an in-force ADR, which is a real bug rather than a number to record.
      - name: Rehydration fidelity — load-bearing must stay 100%
        run: |
          adda eval . --json > eval.json
          cat eval.json
          python - <<'PY'
          import json, sys
          r = json.load(open("eval.json"))
          lb = r["load_bearing_fidelity_pct"]
          print(f"load-bearing: {lb}%  overall: {r['overall_fidelity_pct']}%")
          if lb is None:
              sys.exit("FAIL: eval scored nothing - every architecture file is still the init scaffold")
          if lb < 100.0:
              sys.exit(f"FAIL: load-bearing fidelity {lb}% < 100% — rehydrate has lost critical architecture memory")
          PY

      # BUG-ADDA-023. hatchling's default sdist ships everything git tracks, so
      # `python -m build` packed internal files that must never be published -
      # one of them carrying a credential. pyproject now allowlists the sdist;
      # this is the cheap proof that allowlist is right, the same way the export
      # script proves its own. A publish is irreversible, so this fails closed.
      - name: Package guard — the sdist must contain nothing internal
        if: matrix.python-version == '3.13'
        run: |
          pip install build==1.4.2
          python -m build --sdist --outdir "${RUNNER_TEMP}/sd" .
          python - <<'PY'
          import glob, os, sys, tarfile
          names = tarfile.open(glob.glob(os.environ["RUNNER_TEMP"] + "/sd/*.tar.gz")[0]).getnames()
          rels = [n.split("/", 1)[1] for n in names if "/" in n]
          # Packaging metadata legitimately ships; nothing else hidden should.
          allowed = {"README.md", "OKF_SCHEMA.md", ".gitignore", ".gitattributes"}
          bad = [r for r in rels
                 if (r.split("/")[0].startswith(".") and r not in allowed)
                 or (r.endswith(".md") and "/" not in r and r not in allowed)]
          if bad:
              print("
".join("  " + b for b in sorted(bad)))
              sys.exit(f"FAIL: {len(bad)} file(s) in the sdist are not part of the package")
          print(f"sdist clean: {len(rels)} files")
          PY

      # Only present in the private working repo. The published repo runs the
      # same workflow file and simply skips this step, rather than needing a
      # second workflow that could drift from this one.
      - name: Export guard — the public tree must stage clean
        run: |
          if [ -f scripts/export_public.py ]; then
            python scripts/export_public.py . "${RUNNER_TEMP}/adda-public"
          else
            echo "no export script in this repo - skipping (expected in the published copy)"
          fi

      # ENH-ADDA-013, justified by BUG-ADDA-008: the hand-rolled export marker
      # scan reported clean over a real leak, and the manual grep used to verify
      # it shared the identical blind spot.
      #
      # `--no-git` scans the WORKING TREE, not history, on purpose. The private
      # working repo's history carries a credential synced in from a shared
      # upstream config, which is not this repository's to rotate. Failing every
      # build on a true positive nobody here can fix trains people to ignore the
      # check. Scanning the tree still blocks any NEW secret from being
      # committed, which is the part this repository controls.
      - name: Secrets (gitleaks)
        if: matrix.python-version == '3.13'
        run: |
          V=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz"             | tar -xz -C /tmp gitleaks
          /tmp/gitleaks detect --no-git --redact --verbose --exit-code 1
