# Developed by - Vedavyas Vayalpadu - vyas4c3@gmail.com
# Coded by - Claude Code
#
# ENH-ADDA-019. Publishes to PyPI with NO stored credential: PyPI's trusted
# publishing accepts a short-lived OIDC token minted by GitHub for this exact
# repository and workflow. There is no API token to leak, rotate or accidentally
# package - which matters here, because BUG-ADDA-023 found a credential one
# `twine upload` away from being published permanently.
#
# Runs in the PUBLIC mirror, never in the working repo. A PyPI version number
# can never be reused, so every gate below fails closed.
#
# BUG-ADDA-049: anyone who can push a `v*` tag to the mirror could publish.
# So build and publish are separate jobs and only publish holds the OIDC
# token; publish runs in the `pypi` environment, where a required reviewer
# (set in the mirror's settings) must approve; every action is pinned to a
# commit SHA, because a moved tag is how a third-party action gets swapped;
# and only a tag push starts it, so the tag/version check can never be skipped.

name: Release to PyPI

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    # This file is the SOURCE in the working repo and only executable in the
    # mirror. Without this, tagging a release in the working repo would start a
    # publish that fails at the OIDC handshake - safe, because PyPI trusts only
    # the mirror, but a confusing red run for a thing that was never allowed to
    # happen. Refusing by name is clearer than being refused by PyPI.
    if: github.repository == 'vyasdx/adda-cli'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false  # zizmor artipacked: no later step needs the token

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"

      - name: Build
        run: |
          pip install build==1.4.2 twine==7.0.0
          python -m build --sdist --wheel --outdir dist .

      # A tag that disagrees with the packaged version publishes the wrong
      # thing under the right name, and the wrong thing cannot be withdrawn.
      - name: Tag must match the packaged version
        run: |
          python - <<'PY'
          import os, sys, tomllib
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          tag = os.environ["GITHUB_REF"].removeprefix("refs/tags/v")
          print(f"tag v{tag} / packaged {version}")
          if tag != version:
              sys.exit(f"FAIL: tag v{tag} does not match pyproject version {version}")
          PY

      # The same allowlist proof CI runs. Repeated here deliberately: this is
      # the irreversible step, and a guard that only runs upstream is a guard
      # someone can route around.
      - name: Package guard — nothing internal may ship
        run: |
          python - <<'PY'
          import glob, sys, tarfile
          names = tarfile.open(glob.glob("dist/*.tar.gz")[0]).getnames()
          rels = [n.split("/", 1)[1] for n in names if "/" in n]
          allowed = {"README.md", "OKF_SCHEMA.md", ".gitignore", ".gitattributes"}
          bad = [r for r in rels
                 if (r.split("/")[0].startswith(".") and r not in allowed)
                 or (r.endswith(".md") and "/" not in r and r not in allowed)]
          if bad:
              for b in sorted(bad):
                  print('  ' + b)
              sys.exit(f"FAIL: {len(bad)} file(s) in the sdist are not part of the package")
          print(f"sdist clean: {len(rels)} files")
          PY

      # `adda init` scaffolds from packaged template files. A wheel that builds
      # but ships none of them installs fine and breaks on first use.
      - name: The wheel must carry the init templates
        run: |
          python - <<'PY'
          import glob, sys, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          templates = [n for n in names if "/templates/" in n]
          print(f"templates in wheel: {len(templates)}")
          if len(templates) < 7:
              sys.exit("FAIL: wheel is missing scaffold templates - `adda init` would break")
          PY

      - name: Metadata check
        run: python -m twine check dist/*

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    if: github.repository == 'vyasdx/adda-cli'
    runs-on: ubuntu-latest
    environment: pypi     # add a required reviewer to this environment in the mirror's settings
    permissions:
      id-token: write     # the OIDC token that replaces an API token
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
